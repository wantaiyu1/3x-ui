name: Mirror binaries to binaries branch

# 本 fork 不跟随上游发版：把可用的面板二进制包镜像到自有分支，安装/更新脚本
# 只从本分支取资产，不再访问 MHSanaei/3x-ui 的 release。
#
# 目标分支布局（由脚本按 raw 地址直接下载）：
#   VERSION                                   -> 当前版本号（tag 名，如 v3.11.0）
#   x-ui/<tag>/x-ui-linux-<arch>.tar.gz
#   x-ui/<tag>/x-ui-linux-<arch>.tar.gz.sha256
#   x-ui/latest/...                           -> 内容与当前版本相同

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（写进 VERSION 与目录名，例如 v3.11.0）'
        required: true
        default: 'v3.11.0'
      upstream_tag:
        description: '上游 release tag（资产来源）'
        required: true
        default: 'v3.11.0'
      arch:
        description: '要镜像的架构'
        required: true
        default: 'amd64'
        type: choice
        options: [amd64, arm64, armv7, armv6, 386, armv5, s390x, all]

permissions:
  contents: write
  actions: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve arch list
        id: arch
        run: |
          if [ "${{ inputs.arch }}" = "all" ]; then
            echo "list=amd64 arm64 armv7 armv6 386 armv5 s390x" >> "$GITHUB_OUTPUT"
          else
            echo "list=${{ inputs.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream release assets
        env:
          UP_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          mkdir -p stage /tmp/dl
          base="https://github.com/MHSanaei/3x-ui/releases/download/${UP_TAG}"
          for a in ${{ steps.arch.outputs.list }}; do
            name="x-ui-linux-${a}.tar.gz"
            echo "== fetching ${name}"
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 --speed-limit 1024 --speed-time 300 \
                 -o "/tmp/dl/${name}" "${base}/${name}"
            curl -fsL --retry 5 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 \
                 -o "/tmp/dl/${name}.sha256" "${base}/${name}.sha256" || true

            if [ -s "/tmp/dl/${name}.sha256" ]; then
              expected=$(awk 'NR==1{print $1}' "/tmp/dl/${name}.sha256")
            else
              expected=$(sha256sum "/tmp/dl/${name}" | awk '{print $1}')
            fi
            actual=$(sha256sum "/tmp/dl/${name}" | awk '{print $1}')
            if [ -n "${expected}" ] && [ "${expected}" != "${actual}" ]; then
              echo "checksum mismatch for ${name}: expected ${expected}, got ${actual}" >&2
              exit 1
            fi
            echo "${actual}  ${name}" > "stage/${name}.sha256"
            mv "/tmp/dl/${name}" "stage/${name}"
          done
          ls -lh stage

      - name: Repack with localized x-ui.sh
        env:
          LOCALIZED_SCRIPT: https://raw.githubusercontent.com/wantaiyu1/3x-ui/zh-cn/x-ui.sh
        run: |
          set -euo pipefail
          mkdir -p /tmp/zh
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
               -o /tmp/zh/x-ui.sh "${LOCALIZED_SCRIPT}"
          [ -s /tmp/zh/x-ui.sh ] || { echo "localized x-ui.sh download failed" >&2; exit 1; }
          head -n 3 /tmp/zh/x-ui.sh

          for f in stage/x-ui-linux-*.tar.gz; do
            a=$(basename "$f" .tar.gz)
            work="/tmp/work/${a}"
            rm -rf "${work}"; mkdir -p "${work}"
            tar -xzf "$f" -C "${work}"
            [ -f "${work}/x-ui/x-ui" ] || { echo "$f is missing x-ui/x-ui" >&2; exit 1; }
            # 用汉化脚本替换发布包内的英文脚本，做到“装完即中文”
            cp -f /tmp/zh/x-ui.sh "${work}/x-ui/x-ui.sh"
            chmod +x "${work}/x-ui/x-ui.sh" "${work}/x-ui/x-ui"
            ( cd "${work}" && tar -zcf "/tmp/dl/${a}.tar.gz" x-ui )
            mv -f "/tmp/dl/${a}.tar.gz" "stage/${a}.tar.gz"
            sha256sum "stage/${a}.tar.gz" | sed 's#stage/##' > "stage/${a}.tar.gz.sha256"
            echo "repacked ${a}.tar.gz $(stat -c%s "stage/${a}.tar.gz") bytes"
          done

      - name: Publish to binaries branch
        env:
          GM: "docs(i18n): mirror release assets"
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf publish; mkdir -p "publish/x-ui/${TAG}" publish/x-ui/latest
          for f in stage/*; do
            b=$(basename "$f")
            cp -f "$f" "publish/x-ui/${TAG}/${b}"
            cp -f "$f" "publish/x-ui/latest/${b}"
          done
          printf '%s\n' "${TAG}" > publish/VERSION
          printf 'Localized build of 3X-UI. Version %s, mirrored from upstream release assets and repacked with the zh-cn x-ui.sh.\n' "${TAG}" > publish/README.md

          git init -q -b binaries publish
          cd publish
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${GM} ${TAG}"
          # 用 URL 里带 token 的方式推送，避免额外的 remote 配置
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/wantaiyu1/3x-ui.git" binaries:binaries
